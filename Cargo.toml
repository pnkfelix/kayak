[workspace]
resolver = "3"
members = ["crates/kayak-rt", "crates/kayak-jit", "crates/kayak-sync", "crates/kfx-corpus", "crates/kfx-io", "crates/kayak-fx26", "crates/kayak-cells", "crates/kayak-checks", "boot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

# For profiling (C239): the release build with line tables, so that `perf`
# names the Rust's lines (tier 1's interpreter, kayak-jit's routines), the
# normal build unslowed. `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
