[package]
name = "kayak-kcrt-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# The routines kc's native code calls (C452), apart from a built program's
# `main` (kayak-kcrt), so that kayak-rt links them into kc for `kc run`.
# Its unit tests run (C468): it defines no `main`, unlike kayak-kcrt, whose
# `test = false` this had copied.
[lib]
doctest = false

[dependencies]
# Fixpt's layout, the one table of tags and kinds (TODO §56, step 1).
kayak-layout = { path = "../kayak-layout" }
