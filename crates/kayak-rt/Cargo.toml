[package]
name = "kayak-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Fixpt's layout, the one table of tags and kinds (TODO §56, step 1).
kayak-layout = { path = "../kayak-layout" }
kayak-jit = { path = "../kayak-jit" }
kayak-kcrt-core = { path = "../kayak-kcrt-core" }
kayak-reps = { path = "../kayak-reps" }
kayak-runner = { path = "../kayak-runner" }
kayak-sched = { path = "../kayak-sched" }
kayak-trace = { path = "../kayak-trace" }
kayak-sync = { path = "../kayak-sync", optional = true }
libc = "0.2.189"

[features]
heap-stats = []
# `par`'s branches that share what is written, at once (C102), by kayak-sync's
# `unsafe`; without it they run in turn.
unsafe-par = ["dep:kayak-sync"]

[lints]
workspace = true
